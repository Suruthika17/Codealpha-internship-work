<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Language Translation Tool</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <h2>Language Translation Tool</h2>

  <textarea id="inputText" rows="6" placeholder="Enter text to translate..."></textarea>

  <div class="select-group">
    <div>
      <label for="sourceLanguage">Select source language:</label>
      <select id="sourceLanguage">
        <option value="auto" selected>Auto Detect</option>
        <option value="ta">Tamil</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="zh-CN">Chinese (Simplified)</option>
      </select>
    </div>
    <div>
      <label for="targetLanguage">Select target language:</label>
      <select id="targetLanguage">
        <option value="ta">Tamil</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="zh-CN">Chinese (Simplified)</option>
      </select>
    </div>
  </div>

  <button id="translateBtn" aria-label="Translate Text">Translate</button>

  <div>
    <strong>Translated Text:</strong>
    <p id="translationResult"></p>
  </div>
</div>

<script>
async function translateText(text, sourceLang, targetLang) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error('Translation API error');
  const data = await response.json();
  return data[0].map(part => part[0]).join('');
}

document.getElementById('translateBtn').onclick = async () => {
  const text = document.getElementById('inputText').value.trim();
  const sourceLang = document.getElementById('sourceLanguage').value;
  const targetLang = document.getElementById('targetLanguage').value;
  const output = document.getElementById('translationResult');

  if (!text) {
    output.textContent = 'Please enter some text to translate.';
    return;
  }
  output.textContent = 'Translating...';

  try {
    const translated = await translateText(text, sourceLang, targetLang);
    output.textContent = translated;
  } catch (error) {
    output.textContent = 'Error occurred during translation.';
    console.error(error);
  }
};
</script>
</body>
</html>
